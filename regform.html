<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up - CeylonTourMate.lk</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <script type="text/javascript" src="validateregform.js"></script>
</head>
<body>

<!-- NAVBAR -->
<div class="navbar">
    <table>
        <tr>
            <td class="logo-cell">
                <a href="index.html"><span class="logo-text">Ceylon<span>TourMate</span>.lk</span></a>
            </td>
            <td class="nav-links-cell">
                <a href="index.html">Home</a>
                <a href="index.html#explore">Explore</a>
                <a href="index.html#about">About Us</a>
            </td>
            <td class="nav-buttons-cell">
                <a href="login.html"><button class="btn btn-login">Login</button></a>
                <a href="regform.html"><button class="btn btn-signup">Sign Up</button></a>
            </td>
        </tr>
    </table>
</div>

<!-- REGISTER FORM SECTION -->
<div class="auth-section">
    <div class="auth-card">
        <h2>Create your account</h2>
        <p class="auth-subtitle">Join CeylonTourMate.lk as a tourist or local partner</p>

        <form name="regform" method="post" action="regbackend.php" enctype="multipart/form-data" onsubmit="return validateRegForm();">

            <!-- Role selection -->
            <label>I am registering as</label>
            <select name="role" id="role" onchange="toggleRoleFields()">
                <option value="">-- Select your role --</option>
                <option value="tourist">Tourist</option>
                <option value="tour_guide">Tour Guide</option>
                <option value="shop_owner">Shop Owner</option>
                <option value="hotel_owner">Hotel Owner</option>
                <option value="experience_provider">Experience Provider</option>
            </select>

            <!-- Common fields -->
            <table class="form-table">
                <tr>
                    <td>
                        <label>First Name</label>
                        <input type="text" name="firstname">
                    </td>
                    <td>
                        <label>Last Name</label>
                        <input type="text" name="lastname">
                    </td>
                </tr>
                <tr>
                    <td>
                        <label>Username</label>
                        <input type="text" name="username">
                    </td>
                    <td>
                        <label>Phone Number</label>
                        <input type="text" name="phone">
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                        <label>Email Address</label>
                        <input type="email" name="email">
                    </td>
                </tr>
                <tr>
                    <td>
                        <label>Password</label>
                        <input type="password" name="password">
                    </td>
                    <td>
                        <label>Confirm Password</label>
                        <input type="password" name="cpassword">
                    </td>
                </tr>
            </table>

            <!-- Security question (used for password reset) -->
            <label>Security Question</label>
            <select name="security_question">
                <option value="">-- Select a security question --</option>
                <option value="What is your pet's name?">What is your pet's name?</option>
                <option value="What city were you born in?">What city were you born in?</option>
                <option value="What is your mother's maiden name?">What is your mother's maiden name?</option>
                <option value="What was your first school?">What was your first school?</option>
            </select>
            <label>Security Answer</label>
            <input type="text" name="security_answer">

            <!-- ===== TOUR GUIDE ONLY: license upload tied to account verification ===== -->
            <div id="tourguide-fields" class="role-fields" style="display:none;">
                <h3>Tour Guide Verification</h3>
                <label>License Number</label>
                <input type="text" name="license_number">
                <label>Upload License</label>
                <input type="file" name="license_image" accept="image/*,.pdf">
            </div>

            <button type="submit" class="btn btn-primary btn-full">Create Account</button>
        </form>

        <p class="auth-switch">Already have an account? <a href="login.html">Login here</a></p>
    </div>
</div>

</body>
</html>
