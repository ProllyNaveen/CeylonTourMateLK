<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - CeylonTourMate.lk</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <script type="text/javascript" src="validateforgotpassword.js"></script>
</head>
<body>

<!-- NAVBAR -->
<div class="navbar">
    <table>
        <tr>
            <td class="logo-cell">
                <a href="index.html"><span class="logo-text">Ceylon<span>TourMate</span>.lk</span></a>
            </td>
            <td class="nav-links-cell">
                <a href="index.html">Home</a>
                <a href="index.html#explore">Explore</a>
                <a href="index.html#about">About Us</a>
            </td>
            <td class="nav-buttons-cell">
                <a href="login.html"><button class="btn btn-login">Login</button></a>
                <a href="regform.html"><button class="btn btn-signup">Sign Up</button></a>
            </td>
        </tr>
    </table>

<!-- STEP 1: FIND ACCOUNT -->
<div class="auth-section">
    <div class="auth-card auth-card-narrow">
        <h2>Forgot your password?</h2>
        <p class="auth-subtitle">Enter your username or email to find your account</p>

        <form name="findaccountform" method="post" action="findaccountbackend.php" onsubmit="return validateFindAccount();">

            <label>Username or Email</label>
            <input type="text" name="username">

            <button type="submit" class="btn btn-primary btn-full">Continue</button>
        </form>

        <p class="auth-switch"><a href="login.html">Back to Login</a></p>
    </div>
</div>

</body>
</html>
