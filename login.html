<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - CeylonTourMate.lk</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <script type="text/javascript" src="validatelogin.js"></script>
</head>
<body>

<!-- NAVBAR -->
<div class="navbar">
    <table>
        <tr>
            <td class="logo-cell">
                <a href="index.html"><span class="logo-text">Ceylon<span>TourMate</span>.lk</span></a>
            </td>
            <td class="nav-links-cell">
                <a href="index.html">Home</a>
                <a href="index.html#explore">Explore</a>
                <a href="index.html#about">About Us</a>
            </td>
            <td class="nav-buttons-cell">
                <a href="login.html"><button class="btn btn-login">Login</button></a>
                <a href="regform.html"><button class="btn btn-signup">Sign Up</button></a>
            </td>
        </tr>
    </table>
</div>

<!-- LOGIN FORM SECTION -->
<div class="auth-section">
    <div class="auth-card auth-card-narrow">
        <h2>Welcome back</h2>
        <p class="auth-subtitle">Login to your CeylonTourMate.lk account</p>

        <form name="loginform" method="post" action="loginbackend.php" onsubmit="return validateLoginForm();">

            <label>Username or Email</label>
            <input type="text" name="username">

            <label>Password</label>
            <input type="password" name="password">

            <div class="login-extra-row">
                <label class="admin-check-label">
                    <input type="checkbox" name="is_admin" style="width:auto; margin-right:6px;">
                    Login as Admin
                </label>
                <a href="forgotpassword.html" class="forgot-link">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-primary btn-full">Login</button>
        </form>

        <p class="auth-switch">Don't have an account? <a href="regform.html">Sign up here</a></p>
    </div>
</div>

</body>
</html>
